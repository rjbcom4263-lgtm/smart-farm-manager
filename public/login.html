<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17382a" />
    <title>로그인 · 천해마루 스마트팜</title>
    <style>
      :root{font-family:"Noto Sans KR",Arial,sans-serif;color:#243d2b;background:#f4f7f0}
      *{box-sizing:border-box}
      body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 12%,#e2efd8 0,transparent 34%),radial-gradient(circle at 88% 85%,#e8f1dd 0,transparent 33%),#f4f7f0}
      .login{width:min(100%,430px);background:#fff;border:1px solid #e4ecdf;border-radius:22px;box-shadow:0 24px 70px #17382a17;padding:35px}
      .brand{display:flex;align-items:center;gap:12px;color:#274b33;font-size:16px;font-weight:800;letter-spacing:-.05em}
      .mark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#b8d88d;color:#244633;font-size:27px;font-weight:400}
      .eyebrow{margin:36px 0 7px;color:#6b996f;font-size:11px;font-weight:800;letter-spacing:.18em}
      h1{margin:0;font-size:30px;letter-spacing:-.06em}
      .intro{margin:9px 0 28px;color:#7c9080;font-size:13px;line-height:1.6}
      label{display:block;margin:18px 0 7px;color:#526d59;font-size:12px;font-weight:700}
      input{width:100%;height:45px;border:1px solid #d9e5d7;border-radius:10px;background:#fff;padding:0 13px;color:#243d2b;font:inherit;font-size:14px;outline:none}
      input:focus{border-color:#67a376;box-shadow:0 0 0 3px #e1f0df}
      .password{position:relative}
      .password input{padding-right:62px}
      .password button{position:absolute;right:6px;top:5px;height:35px;padding:0 10px;border:0;background:transparent;color:#5f8065;font-size:11px;font-weight:700;cursor:pointer}
      .error{min-height:19px;margin:11px 0 0;color:#bd4d43;font-size:12px}
      .submit{width:100%;height:46px;margin-top:13px;border:0;border-radius:10px;background:#2d6844;color:#fff;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
      .submit:hover{background:#215638}
      .submit:disabled{opacity:.6;cursor:wait}
      .foot{margin:23px 0 0;border-top:1px solid #edf2e9;padding-top:19px;color:#98a99a;text-align:center;font-size:11px}
      @media(max-width:480px){.login{padding:27px 23px}h1{font-size:27px}}
    </style>
  </head>
  <body>
    <main class="login">
      <div class="brand"><span class="mark" aria-hidden="true">✳</span><span>천해마루 스마트팜</span></div>
      <p class="eyebrow">SMART FARM MANAGER</p>
      <h1>온실 관리 로그인</h1>
      <p class="intro">계정 정보를 입력해 온실 기록을 확인하세요.</p>
      <form id="login-form">
        <label for="username">사용자 이름</label>
        <input id="username" name="username" autocomplete="username" value="천해마루" required />
        <label for="password">비밀번호</label>
        <div class="password"><input id="password" name="password" type="password" autocomplete="current-password" required autofocus /><button id="show-password" type="button" aria-pressed="false">보기</button></div>
        <p class="error" id="error" role="alert" aria-live="polite"></p>
        <button class="submit" id="submit" type="submit">로그인</button>
      </form>
      <p class="foot">천해마루 스마트팜 · 관리</p>
    </main>
    <script>
      const form = document.querySelector('#login-form');
      const password = document.querySelector('#password');
      const error = document.querySelector('#error');
      const submit = document.querySelector('#submit');
      const show = document.querySelector('#show-password');
      show.addEventListener('click', () => {
        const visible = password.type === 'password';
        password.type = visible ? 'text' : 'password';
        show.textContent = visible ? '숨기기' : '보기';
        show.setAttribute('aria-pressed', String(visible));
      });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        error.textContent = '';
        submit.disabled = true;
        submit.textContent = '확인 중...';
        try {
          const response = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ username: form.elements.namedItem('username').value.trim(), password: password.value }) });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || '로그인에 실패했습니다.');
          const next = new URLSearchParams(location.search).get('next');
          const target = new URL(next || '/', location.origin);
          const safe = target.origin === location.origin && target.pathname !== '/login' && target.pathname !== '/login.html' && !target.pathname.startsWith('/api/')
            ? target.pathname + target.search + target.hash : '/';
          location.replace(safe);
        } catch (reason) {
          error.textContent = reason.message || '연결을 확인해 주세요.';
          submit.disabled = false;
          submit.textContent = '로그인';
          password.focus();
        }
      });
    </script>
  </body>
</html>
