<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f1" />
    <title>천해마루 스마트팜 · 관리</title>
    <meta name="description" content="온실의 작업 일정과 재배 기록을 한눈에 관리합니다." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#dashboard" aria-label="천해마루 스마트팜 홈">
          <span class="brand-mark"><span>✳</span></span>
          <span><strong>천해마루 스마트팜</strong><small>SMART FARM MANAGER</small></span>
        </a>
        <div class="nav-label">WORKSPACE</div>
        <nav class="main-nav" aria-label="주 메뉴">
          <button data-page="dashboard" class="active"><span class="nav-icon">▦</span> 대시보드</button>
          <button data-page="records"><span class="nav-icon">▤</span> 재배 기록</button>
          <button data-page="journal"><span class="nav-icon">✎</span> 업무 일지</button>
          <button data-page="greenhouse"><span class="nav-icon">⬡</span> 온실 배치도 <span class="nav-tag">3D</span></button>
          <button data-page="archive"><span class="nav-icon">▣</span> 스마트팜 아카이브</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="sidebar-note"><span class="live-dot"></span><strong>재배 기록 보관</strong><small>기록을 엑셀로 내려받아 백업할 수 있습니다.</small></div>
          <div class="sidebar-caption">온실의 하루를 더 선명하게.</div>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb">천해마루 스마트팜 <span>/</span> <strong id="breadcrumb">대시보드</strong></div>
          <div class="topbar-right"><span class="today-pill" id="today-date"></span><span class="avatar" aria-label="운영자">농</span><button class="logout-btn" id="logout-button" type="button" hidden>로그아웃</button></div>
        </header>
        <main id="app" tabindex="-1"><div class="loading">온실 기록을 불러오는 중...</div></main>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
